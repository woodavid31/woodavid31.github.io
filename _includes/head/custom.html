{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=2" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=2"/>
<link rel="shortcut icon" href="{{ base_path }}/favicon.ico?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/favicon.png?v=2"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<style>
.greedy-nav {
  padding-right: 5rem;
}
.greedy-nav button {
  right: 2.4rem;
}
.greedy-nav .masthead__theme-toggle {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  z-index: 101;
}
.greedy-nav .masthead__theme-toggle a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2.5rem;
  margin: 0;
  padding: 0;
  color: var(--global-masthead-link-color);
  cursor: pointer;
}
.greedy-nav .masthead__theme-toggle a:hover {
  color: var(--global-masthead-link-color-hover);
}
.publications-list {
  margin-top: 0.75em;
}
.publication-entry {
  margin: 0 0 1em;
  padding: 1em 1.1em;
  border: 1px solid var(--global-border-color);
  border-left: 3px solid var(--global-link-color);
  border-radius: 4px;
  background: var(--global-bg-color);
}
.publication-entry h3 {
  margin: 0 0 0.45em;
  font-size: 1em;
  line-height: 1.35;
  color: var(--global-text-color);
}
.publication-entry p {
  margin: 0.2em 0;
  line-height: 1.45;
}
.publication-authors {
  color: var(--global-text-color);
}
.publication-venue {
  color: var(--global-text-color-light);
  font-style: italic;
}
.publication-note {
  color: var(--global-text-color-light);
  font-size: 0.92em;
}
.publication-links {
  padding-top: 0.35em;
  font-size: 0.92em;
}
.publication-links a {
  color: var(--global-link-color);
  font-weight: 600;
  text-decoration: none;
}
.publication-links a:hover {
  text-decoration: underline;
}
.publication-links span {
  margin-right: 0.35em;
}
.publication-link-unavailable {
  color: var(--global-text-color-light);
}
.compact-publications .publication-entry {
  padding: 0.9em 1em;
}
.cv-pdf-viewer {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  border: 1px solid #d9d9d9;
  background: #f8f8f8;
}
.cv-pdf-viewer object,
.cv-pdf-viewer iframe {
  display: block;
  border: 0;
}
@media (max-width: 600px) {
  .publication-entry {
    padding: 0.85em 0.9em;
  }
  .cv-pdf-viewer object,
  .cv-pdf-viewer iframe {
    height: 680px;
  }
}
</style>

<!-- end custom head snippets -->
